services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.8
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ['CMD', 'bash', '-c', "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      retries: 5
      timeout: 5s
    networks:
      - alpacastream

  broker:
    image: confluentinc/cp-kafka:7.4.0
    container_name: broker
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_SUPPORT_METRICS_ENABLE: 'false'
      CONFLUENT_METRICS_ENABLE: 'false'
      CONFLUENT_SUPPORT_CUSTOMER_ID: 'anonymous'
      KAFKA_CONFLUENT_LICENSE: ' '
    healthcheck:
      test: ['CMD', 'bash', '-c', "nc -z localhost 9092"]
      interval: 10s
      retries: 5
      timeout: 5s
    networks:
      - alpacastream

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alpacastream

  kafka-topic-init:
    build: 
      context: .
      dockerfile: scripts/Dockerfile.kafka-topic
    env_file:
      - .env
    depends_on:
      broker:
        condition: service_healthy
    networks:
      - alpacastream
    restart: "no"

  minio-bucket-init:
    build: 
      context: .
      dockerfile: scripts/Dockerfile.minio-bucket
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - alpacastream
    restart: "no"

  spark:
    image: bitnami/spark:latest
    container_name: spark
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "4040:4040"
    volumes:
      - ./spark_jobs:/opt/bitnami/spark/jobs
      - ./data/minio:/data
    command: sleep infinity
    networks:
      - alpacastream

  postgres:
    image: postgres:15
    container_name: postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-marketdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - alpacastream

  x-airflow-common:
    &airflow-common
    image: apache/airflow:2.6.1-python3.9
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-marketdb}
      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__CORE__LOGGING_LEVEL: INFO
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    depends_on:
      - postgres
    networks:
      - alpacastream

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command: >
      -c "airflow users list || (airflow db init && airflow users create
        --role Admin
        --username ${AIRFLOW_ADMIN_USER:-admin}
        --password ${AIRFLOW_ADMIN_PASSWORD:-airflow}
        --firstname ${AIRFLOW_ADMIN_FIRSTNAME:-Admin}
        --lastname ${AIRFLOW_ADMIN_LASTNAME:-User}
        --email ${AIRFLOW_ADMIN_EMAIL:-email})"
    restart: on-failure
    networks:
      - alpacastream

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: airflow webserver
    ports:
      - "8080:8080"
    restart: always
    networks:
      - alpacastream

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: airflow scheduler
    restart: always
    networks:
      - alpacastream

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    networks:
      - alpacastream

  alpaca-producer:
    build:
      context: ./producers
    env_file:
      - .env
    command: python ingestion/alpaca_ingestion.py
    environment:
      KAFKA_BROKER: broker:29092
      KAFKA_TOPIC: alpaca_raw_stream
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      broker:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - alpacastream

  finnhub-producer:
    build:
      context: ./producers
    env_file:
      - .env
    commmand: python ingestion/finnhub_ingestion.py
    environment:
      KAFKA_BROKER: broker:29092
      KAFKA_TOPIC: finnhub_raw_stream
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      broker:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - alpacastream
  alpaca-consumer:
    build:
      context: ./consumers
    environment:
      KAFKA_BROKER: broker:29092
      KAFKA_TOPIC: alpaca_raw_stream
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      broker:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - alpacastream

networks:
  alpacastream:
    driver: bridge

volumes:
  postgres_data:
